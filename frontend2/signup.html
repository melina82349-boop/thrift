
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | THRIFT</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>

    <main class="signup-container">
        <section class="signup-card">

            <a href="../../frontend/home.html" class="logo">
                THRIFT<span>.</span>
            </a>

            <h1>Create your account</h1>
            <p class="subtitle">Join THRIFT and discover something special.</p>

            <form id="signupForm">

                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 98XXXXXXXX" required>
                </div>
<div class="input-group">
    <label for="password">Password</label>

    <div class="password-wrapper">
        <input type="password" id="password"
               placeholder="Create a password"
               minlength="8" required>

        <button type="button" class="toggle-password"
                onclick="togglePassword('password', this)">
            <i class="fa-regular fa-eye"></i>
        </button>
    </div>
</div>

<div class="input-group">
    <label for="confirmPassword">Confirm Password</label>

    <div class="password-wrapper">
        <input type="password" id="confirmPassword"
               placeholder="Enter password again" required>

        <button type="button" class="toggle-password"
                onclick="togglePassword('confirmPassword', this)">
            <i class="fa-regular fa-eye"></i>
        </button>
    </div>
</div>
                <button type="submit" class="signup-btn">Create Account</button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="../../frontend/home.html" class="home-link">← Back to Home</a>

        </section>
    </main>
<script src="signup.js"></script>

</body>
</html>
